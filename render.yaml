databases:
  - name: jobhunter-db
    databaseName: jobhunter
    user: jobhunter
    plan: free

services:
  - type: web
    name: ai-job-hunter
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jobhunter-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOW_DEMO_DB
        value: "false"
      - key: SEED_DEMO
        value: "true"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: DISCOVERY_INTERVAL_MINUTES
        value: "360"
      - key: TRUST_PROXY
        value: "true"
