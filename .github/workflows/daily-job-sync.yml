name: Daily AI Job Hunter Sync & 10x Contribution Workflow

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute 10x Contribution & Benchmark Sync Script
        run: node scripts/generate_contributions.js

      - name: Validate TypeScript & Build Bundle
        run: npm run build
